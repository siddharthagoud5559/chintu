<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh}
.container{background:#fff;padding:20px;width:350px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.2)}
h2{text-align:center}
label{font-weight:bold}
input,select{width:100%;padding:8px;margin:8px 0 15px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
input[type=submit]{background:#007BFF;color:#fff;border:none;cursor:pointer}
input[type=submit]:hover{background:#0056b3}
</style>
</head>
<body>
<div class="container">
<h2>Registration Form</h2>
<form>
<label>Full Name</label>
<input type="text" required>
<label>Email</label>
<input type="email" required>
<label>Password</label>
<input type="password" required>
<label>Confirm Password</label>
<input type="password" required>
<label>Gender</label>
<select>
<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<label>Phone Number</label>
<input type="tel">
<input type="submit" value="Register">
</form>
</div>
</body>
</html>
